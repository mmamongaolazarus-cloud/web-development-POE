    <header>

        
    <p>
        <img src="images/logo.png"
            alt="Goal-Zone Soccer Logo"
            width="300">
    </p>

     <h1>Make an Enquiry</h1>

        <p>
            <em>Tell us what you are looking for.</em>
        </p>

        <hr>

    </header>

        <!-- ========================= -->

     <nav>

    <!-- ========================= -->
    <!-- enquiry section code -->
    <!-- ========================= -->

    <main>

        <section>

            <h2>Product Enquiry Form</h2>

            <p>
                Complete the form below and we will contact you.
            </p>

            <hr>

            <form>

                <!-- Personal Information -->
                <section>

                    <h3>Personal Information</h3>

                    <p>

                        <label for="fullname">
                            Full Name:
                        </label>

                        <br>

                        <input type="text"
                               id="fullname"
                               name="fullname"
                               placeholder="Enter your full name">

                    </p>

                    <p>

                        <label for="email">
                            Email Address:
                        </label>

                        <br>

                        <input type="email"
                               id="email"
                               name="email"
                               placeholder="Enter your email address">

                    </p>

                    <p>
                        
                        <label for="phone">
                            Telephone Number:
                        </label>

                        <br>

                        <input type="tel"
                               id="phone"
                               name="phone"
                               placeholder="Enter your phone number">

                    </p>

                </section>

                <!-- Order Information -->
                <section>

                    <h3>Order Information</h3>

                    <p>

                        <label for="quantity">
                            Number of Items:
                        </label>

                        <br>

                        <input type="number"
                               id="quantity"
                               name="quantity"
                               min="1"
                               max="80">

                    </p>

                    <p>

                        <label for="eventdate">
                            Event Date:
                        </label>

                        <br>

                        <input type="date"
                               id="eventdate"
                               name="eventdate">

                    </p>


                    <!--OPTIONS FOR PURCHASING-->
                    <p>

                        <label for="product">Choose your soccer boots:</label>
                            Product:
                        
                            <select id="product" name="product">

                                <option value="speed-pro">
                                    Speed Pro-Boots
                                </option>

                                <option value="elite-control">
                                    Elite Control-Boots
                                </option>

                                <option value="pro-strike">
                                    Pro Strike Boots
                                </option>
                                
                                <option value="power-flex">
                                    Power Flex Boots
                                </option>

                            </select>

                            </p>


                        


</body>
</html>
